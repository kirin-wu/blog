server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /var/www/kirin-blog/.vitepress/dist;
  index index.html;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location ~* \.(css|js|mjs|json|ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
  }
}
